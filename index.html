<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>tide</title>
    <script id="theme-bootstrap">
      (() => {
        let preference = 'system'
        try { preference = localStorage.getItem('tide-theme-preference') || 'system' } catch {}
        const dark = preference === 'dark' || (preference !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <div id="app">
      <div id="editor"></div>
      <footer id="statusbar">
        <span id="status-left"></span>
        <div id="theme-selector" class="tide-theme-selector" role="group" aria-label="外观">
          <button class="tide-theme-option" type="button" data-theme-choice="light" aria-label="浅色" title="浅色" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v2M12 19.5v2M4.5 4.5l1.4 1.4M18.1 18.1l1.4 1.4M2.5 12h2M19.5 12h2M4.5 19.5l1.4-1.4M18.1 5.9l1.4-1.4"/></svg>
          </button>
          <button class="tide-theme-option" type="button" data-theme-choice="dark" aria-label="深色" title="深色" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.3A8 8 0 0 1 9.7 4.5a8 8 0 1 0 9.8 9.8Z"/></svg>
          </button>
          <button class="tide-theme-option" type="button" data-theme-choice="system" aria-label="跟随系统" title="跟随系统" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="12" rx="1.5"/><path d="M12 16.5v3M8.5 19.5h7"/></svg>
          </button>
        </div>
        <span id="status-right"></span>
      </footer>
    </div>
  </body>
</html>
