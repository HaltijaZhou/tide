name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 构建与测试（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci

      # 先构建前端：src-tauri 的 tauri-build 在编译期需要 dist 存在
      - name: 构建前端
        run: npm run build

      - name: 前端测试
        run: npm test

      - name: Rust 测试
        run: cargo test --manifest-path src-tauri/Cargo.toml
